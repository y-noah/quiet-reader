<!doctype html><title>受贿6750万余元 刘绍勇获刑十四年 - 百度搜索</title>
<div id="results"><div class="c-result result" tpl="rel_brief_head"><article><section class="cosc-card-content"><div class="modules_23Xhm"><a class="summary_24I7N cos-block">11月3日，法院一审公开宣判中国东方航空集团有限公司原党组书记、董事长刘绍勇受贿案，对被告人刘绍勇以受贿罪判处有期徒刑十四年，并处罚金人民币四百万元，对刘绍勇犯罪所得财物及孳息依法予以追缴，上缴国库。据悉，刘绍勇曾非法收受财物共计折合人民币6750万余元。</a></div></section></article></div></div>
